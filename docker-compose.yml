version: '3.8'

services:
  gvce-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gvce-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://valoreabroker.com
      - DATABASE_URL=postgresql://gvce_user:gvce_secure_password_2026@postgres:5432/gvce_db
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: gvce-postgres
    restart: always
    environment:
      - POSTGRES_USER=gvce_user
      - POSTGRES_PASSWORD=gvce_secure_password_2026
      - POSTGRES_DB=gvce_db
    volumes:
      - gvce_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gvce_user -d gvce_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gvce_pgdata:
